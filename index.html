  <title>afterclass</title>
  <style>
    body { margin: 0; background: #fbfcf8; }
    .startup-screen { box-sizing: border-box; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; background: #fbfcf8; color: #244d42; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .startup-mark { display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: 24px; border-radius: 24px; background: #edf1e6; font: 48px/1 Georgia, serif; color: #244d42; }
    .startup-wordmark { font-size: 30px; font-weight: 700; letter-spacing: -1.4px; }
    .startup-tagline { margin: 10px 0 30px; color: #69766a; font-size: 13px; line-height: 1.6; }
    .startup-status { display: flex; align-items: center; gap: 10px; color: #6c796c; font-size: 12px; }
    .startup-dots { display: flex; gap: 4px; }
    .startup-dots i { width: 4px; height: 4px; border-radius: 50%; background: #527151; animation: startup-breathe 1.6s ease-in-out infinite; }
    .startup-dots i:nth-child(2) { animation-delay: .2s; }
    .startup-dots i:nth-child(3) { animation-delay: .4s; }
    html[data-theme="dark"] body, html[data-theme="dark"] .startup-screen { background:#141d1a; color:#e6ece5; }
    html[data-theme="dark"] .startup-mark { background:#283b31; color:#dce4b7; }
    html[data-theme="dark"] :is(.startup-tagline,.startup-status) { color:#afbab1; }
    @keyframes startup-breathe { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .startup-dots i { animation: none; opacity: .6; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="startup-screen" role="status" aria-live="polite" aria-label="Loading Afterclass">
      <div class="startup-mark" aria-hidden="true">✦</div>
      <div class="startup-wordmark">afterclass</div>
      <p class="startup-tagline">For the life between lectures.</p>
      <div class="startup-status"><span class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Opening your campus…</span></div>
    </div>
  </div>
  <noscript><p style="text-align:center">Enable JavaScript to open Afterclass.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
